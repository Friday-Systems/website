# Build the Vite site and deploy dist/ to GitHub Pages.
#
# One-time setup: in the repo Settings → Pages → "Build and deployment",
# set Source to "GitHub Actions" (instead of "Deploy from a branch") —
# otherwise Pages keeps serving the raw repo, where index.html references
# /src/main.ts and won't run without the build.
#
# dist/ keeps the same /assets/... paths as the current deployment, so the
# existing video URLs (referenced by the design_handoff prototypes) stay live.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
