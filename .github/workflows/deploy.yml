# Build the Vite site and deploy dist/ to GitHub Pages.
#
# One-time setup: in the repo Settings → Pages → "Build and deployment",
# set Source to "GitHub Actions" (instead of "Deploy from a branch") —
# otherwise Pages keeps serving the raw repo, where index.html references
# /src/main.ts and won't run without the build.
#
# dist/ keeps the same /assets/... paths as the current deployment, so the
# existing video URLs (referenced by the design_handoff prototypes) stay live.
#
# Media CDN (optional but recommended — GitHub Pages caps bandwidth and pins
# cache-control to 600s): the MEDIA_BASE repo variable makes the built site
# load videos from a CDN with a content-hash ?v= cache-buster. Two modes:
#   Pull CDN (current: Bunny pull zone with this site as origin) — set only
#     the MEDIA_BASE variable (e.g. https://friday-media.b-cdn.net/); the CDN
#     fetches from Pages on first request and caches at the edge.
#   Push bucket (Cloudflare R2, if ever adopted) — additionally set secrets
#     R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET and
#     the sync step below mirrors assets/videos + assets/scrubs to the bucket.
# While MEDIA_BASE is unset the site serves media same-origin from Pages,
# exactly as before. Changing a video needs no extra step in either mode:
# replace the file in assets/, commit, push — the new hash busts every cache.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      bundle: ${{ steps.bundle.outputs.name }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # setting the repo variable is the deliberate opt-in; a pull CDN needs no secrets
      MEDIA_BASE: ${{ vars.MEDIA_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync media to R2
        if: env.R2_ACCOUNT_ID != ''
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q rclone
          rclone sync assets/ \
            ":s3,provider=Cloudflare,access_key_id=$R2_ACCESS_KEY_ID,secret_access_key=$R2_SECRET_ACCESS_KEY,endpoint=https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com:$R2_BUCKET/assets/" \
            --include "videos/**" --include "scrubs/**" --checksum --fast-list --stats-one-line
      - run: npm run build
      # the bundle name embeds a content hash (and the media ?v= manifest), so
      # it doubles as the freshness sentinel for the purge-cdn job below
      - id: bundle
        run: echo "name=$(basename dist/assets/main-*.js)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Bunny caches media for a year, but GitHub Pages' own CDN can keep serving
  # stale bytes for a few minutes after a deploy reports success — a pull
  # during that window would poison the new ?v= cache keys with old content
  # for a year. So: wait until Pages provably serves THIS deploy (the freshly
  # hashed JS bundle answers 200), give the edge a grace period, then purge
  # the Bunny pull zone (id 6447211 = friday-media). Purged entries refill on
  # demand. Skipped until the BUNNY_API_KEY repo secret exists.
  purge-cdn:
    needs: [build, deploy]
    if: vars.MEDIA_BASE != ''
    runs-on: ubuntu-latest
    env:
      BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
    steps:
      - name: Wait for Pages freshness, then purge Bunny cache
        if: env.BUNNY_API_KEY != ''
        run: |
          base="${{ needs.deploy.outputs.page_url }}"
          url="${base%/}/assets/${{ needs.build.outputs.bundle }}"
          code=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url?cb=$i-$RANDOM")
            [ "$code" = "200" ] && break
            sleep 15
          done
          [ "$code" = "200" ] || { echo "Pages never served $url (last code $code)"; exit 1; }
          sleep 30  # grace for global edge propagation
          http=$(curl -s -o /tmp/purge-body -w '%{http_code}' -X POST \
            "https://api.bunny.net/pullzone/6447211/purgeCache" \
            -H "AccessKey: $BUNNY_API_KEY" -H "content-type: application/json")
          echo "purge response: HTTP $http"
          cat /tmp/purge-body || true
          case "$http" in 200|204) echo "Bunny cache purged." ;; *) exit 1 ;; esac
